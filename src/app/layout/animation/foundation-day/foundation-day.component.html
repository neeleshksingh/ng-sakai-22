<div class="anniversary-container">
    <div class="content-wrapper">
        <div class="anniversary-badge flex flex-column">
            <span style="font-size: 12px; color: rgb(105, 85, 237)">Celebrating</span>
            <span class="year-number">{{ anniversaryYear }}</span>
            <span class="year-suffix">years of</span>
        </div>
        <div class="text-content">
            <div class="title">Jharkhand</div>
            <div class="subtitle">Foundation Day</div>
            <div class="date">{{ jharkhandFoundationDayDate }}</div>
        </div>
    </div>
</div>
