<div *ngIf="isVisible" class="top-bar-animation">
  
  <!-- Animated Text Lines -->
  <div class="greeting-container">
    <div class="greeting-line line-1">Happy & Prosperous</div>
    <div class="year-ticker-wrapper">
      <div class="year-ticker">
        <span class="year new">{{ newYear }}</span>
      </div>
    </div>
    <div class="greeting-line line-3">New Year</div>
  </div>

  <!-- Glowing Stars -->
  <div class="stars-container">
    <div class="star star-1">★</div>
    <div class="star star-2">★</div>
    <div class="star star-3">★</div>
    <div class="star star-4">★</div>
    <div class="star star-5">★</div>
  </div>
</div>
