<p-dialog [(visible)]="visible" [header]="dialogModel?.title ?? ''" [modal]="true" [closable]="false"
    [closeOnEscape]="false" [draggable]="false" [resizable]="false" [style]="{ width: '42rem', 'max-width': '95vw' }"
    [baseZIndex]="10000">

    <div class="flex flex-column gap-4">
        <div class="flex align-items-start gap-3 p-3 border-round-lg surface-100">
            <i class="pi pi-exclamation-triangle text-3xl text-orange-500 mt-1 flex-shrink-0"></i>
            <p class="m-0 text-700 line-height-3">{{ dialogModel?.message }}</p>
        </div>

        <!-- @if (dialogModel?.detailLines && dialogModel!.detailLines.length > 0) {
        <div class="border-round border-1 surface-border overflow-hidden">
            @for (line of dialogModel!.detailLines; track line.label) {
            <div class="flex align-items-center px-3 py-2 border-bottom-1 surface-border">
                <span class="font-semibold text-600 w-8rem flex-shrink-0">{{ line.label }}</span>
                <span class="text-800">{{ line.value }}</span>
            </div>
            }
        </div>
        } -->

        <div class="flex justify-content-end pt-2">
            <p-button label="Navigate to Survey" icon="pi pi-arrow-right" iconPos="right" (onClick)="navigate()">
            </p-button>
        </div>
    </div>
</p-dialog>
