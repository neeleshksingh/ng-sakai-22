<div class="pb-6">
    <p-toast></p-toast>
    <div class="grid">
        <div class="p-4 col-12 md:col-6 mx-auto">
           <div class="card" style="text-align: center;">
                 <h2 class="font-semibold text-primary m-0">Payment Status</h2>
            </div>

            <p-card styleClass="mb-2">
                <ng-template pTemplate="header">
                    <div class="pt-3 col-6 mb-0">
                        <h3 class="text-lg text-800 mb-0">Transaction Details</h3>
                    </div>
                </ng-template>

                <div class="flex flex-column gap-3">
                    <!-- Registration Number -->
                    <div class="flex align-items-center">
                        <label class="text-sm font-medium text-600 w-6">Registration Number</label>
                        <div class="p-inputtext p-component p-readonly bg-gray-50 border-1 surface-border flex-1 ml-3">
                            {{registrationNumber}}
                        </div>
                    </div>

                    <!-- Reference Number -->
                    <div class="flex align-items-center">
                        <label class="text-sm font-medium text-600 w-6">Reference Number</label>
                        <div class="p-inputtext p-component p-readonly bg-gray-50 border-1 surface-border flex-1 ml-3">
                            {{referenceNumber}}
                        </div>
                    </div>

                    <!-- Receipt Number (conditional) -->
                    <div class="flex align-items-center" [hidden]="isHiddenReceiptNumber">
                        <label class="text-sm font-medium text-600 w-6">Receipt Number</label>
                        <div class="p-inputtext p-component p-readonly bg-gray-50 border-1 surface-border flex-1 ml-3">
                            {{reciptNumber}}
                        </div>
                    </div>

                    <!-- Paid Amount -->
                    <div class="flex align-items-center">
                        <label class="text-sm font-medium text-600 w-6">Paid Amount</label>
                        <div class="p-inputtext p-component p-readonly bg-gray-50 border-1 surface-border font-semibold flex-1 ml-3">
                            {{paidAmount | currency: 'INR':true}}
                        </div>
                    </div>

                    <!-- Transaction Date -->
                    <div class="flex align-items-center">
                        <label class="text-sm font-medium text-600 w-6">Transaction Date</label>
                        <div class="p-inputtext p-component p-readonly bg-gray-50 border-1 surface-border flex-1 ml-3">
                            {{transactionDate | date:'medium'}}
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="flex align-items-center">
                        <label class="text-sm font-medium text-600 w-6">Status</label>
                        <div class="flex-1 ml-3">
                            <span class="status-label p-tag p-tag-rounded text-lg" 
                                  [ngClass]="{'p-tag-success': paymentStatusPrint === 'Success', 
                                              'p-tag-danger': paymentStatusPrint !== 'Success'}">
                                {{paymentStatusPrint}}
                            </span>
                        </div>
                    </div>
                </div>
            </p-card>

            <!-- Action Buttons Card -->
          
                <div class="card flex flex-column gap-3 sm:flex-row sm:justify-content-center py-2">
                    <p-button 
                        [disabled]="isHiddenReceipt"
                        label="Print Receipt" 
                        icon="pi pi-print" 
                        severity="secondary"
                        styleClass="flex-1 sm:flex-none"
                        (click)="printReceipt()">
                    </p-button>
                    
                    <p-button 
                        [disabled]="isHiddenRetryPayment"
                        label="Retry Payment" 
                        icon="pi pi-refresh" 
                        severity="warning"
                        styleClass="flex-1 sm:flex-none"
                        (click)="retryPayment()">
                    </p-button>
                </div>
        </div>
    </div>

</div>
