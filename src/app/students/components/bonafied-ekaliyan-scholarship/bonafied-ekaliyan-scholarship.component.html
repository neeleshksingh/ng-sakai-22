<div class="pb-6">
    <div class="grid">
        <p-toast></p-toast>
        <div class="col-12">
            <div class="toolbar-demo card">
                <p-toolbar>
                    <div class="p-toolbar-group-left">
                        <div class="header-left-div">
                            <div class="header-div1">
                                <i class="fa-brands fa-docker" style="font-size: 40px;"></i>
                            </div>
                            <div class="header-div2">
                                <h5>Bonafide E-Kalyan ScholarShip</h5>
                            </div>
                        </div>
                    </div>
                </p-toolbar>
            </div>
        </div>
        <div class="col-12">
            <form [formGroup]="eKalyanScholarshipFormGroup">
                <div class="card p-3">
                    <div class="p-fluid formgrid grid p-ai-end">
                        <div class="field col-12 sm:col-6 md:col-6 lg:col-3">
                            <label for="operationalVerticalId">Semester</label>
                            <p-select [filter]="true" inputId="operationalVerticalId"
                                [options]="operationalVerticalList" formControlName="operationalVerticalId"
                                placeholder="Select Semester"
                                (onChange)="onOperationalVerticalChanged($event)"></p-select>
                        </div>
                        <div class="field col-12 sm:col-6 md:col-6 lg:col-2">
                            <label> &nbsp;</label>
                            <button pButton type="button" icon="pi pi-search" label="View"
                                [disabled]="!eKalyanScholarshipFormGroup.valid" (click)="SearchResult()"></button>
                        </div>
                        <div class="field col-12 sm:col-6 md:col-6 lg:col-4">
                        </div>
                        <div class="field col-12 sm:col-6 md:col-6 lg:col-3" style="margin-top:17px">
                            <button pButton pRipple icon="pi pi-download" label="Mandatory Forms"
                                class="p-button-raised" (click)="downLoadMandatoryForm()"
                                pTooltip="Download Affidavit and Declaration Form"></button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-12">
            <div class="card" *ngIf="downloadEKalyanScholarshipLink">
                <div class="card" style="overflow:auto;">
                    <iframe [src]="downloadEKalyanScholarshipLink | safe" width="100%" height="1500"
                        loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>
