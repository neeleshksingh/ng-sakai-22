<div class="pb-6">
    <div class="grid">
        <p-toast></p-toast>

        <div class="col-12">
            <div class="toolbar-demo card">
                <p-toolbar>
                    <div class="p-toolbar-group-left">
                        <div class="header-left-div">
                            <div class="header-div1">
                                <i
                                    class="pi pi-file-pdf"
                                    style="font-size: 40px"
                                ></i>
                            </div>
                            <div class="header-div2">
                                <h5>{{ componentName }}</h5>
                            </div>
                        </div>
                    </div>
                    <ng-template pTemplate="right">
                        <a
                            [href]="certificateDownloadUrl"
                            target="_blank"
                            rel="noopener noreferrer"
                            download
                        >
                            <button
                                pButton
                                type="button"
                                icon="pi pi-download"
                                label="Download PDF"
                            ></button>
                        </a>
                    </ng-template>
                </p-toolbar>
            </div>
        </div>

        <div class="col-12">
            <div class="card p-0 overflow-hidden">
                <iframe
                    [src]="certificatePreviewUrl"
                    width="100%"
                    height="1100"
                    loading="lazy"
                    style="border: none"
                >
                </iframe>
            </div>
        </div>
    </div>
</div>
