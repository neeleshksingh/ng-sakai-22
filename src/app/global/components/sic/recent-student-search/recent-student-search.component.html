<div class="recent-students-container">
    <div class="grid">
        <div class="col-12" *ngIf="recentStudents.length === 0">
            <div class="empty-state">
                <p>No recent students found.</p>
            </div>
        </div>

        <div class="col-12 md:col-6 lg:col-3" *ngFor="let student of recentStudents">
            <div class="student-card" (click)="onStudentSelect(student.studentId)">
                <img [src]="student.imageUrl || './../../assets/layout/images/icon-profile.png'" alt="Student Profile"
                    class="student-avatar">
                <div class="student-info">
                    <h6 class="student-name">{{ student.studentName }}</h6>
                    <p class="student-id">{{ student.studentId }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
