<div class="dashboard-card-skeleton" aria-label="Loading dashboard cards">
    @for (card of [1, 2, 3, 4]; track card) {
        <div class="card">
            <p-skeleton shape="circle" size="3.5rem" />
            <div class="flex-1">
                <p-skeleton width="55%" height="0.8rem" styleClass="mb-3" />
                <p-skeleton width="80%" height="1.5rem" />
            </div>
        </div>
    }
</div>
