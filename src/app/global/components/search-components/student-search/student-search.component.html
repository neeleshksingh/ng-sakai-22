<div class="pb-6">
    <p-toast></p-toast>
    <div class="grid">
        <form [formGroup]="studentProfileSearchGroup" style="width: 100%;">
            <div class="col-12">
                <div class="toolbar-demo card">
                    <p-toolbar>
                        <div class="p-toolbar-group-left">
                            <div class="header-left-div">
                                <div class="header-div1">
                                    <i class="fas fa-brain" style="font-size: 40px;"></i>
                                </div>
                                <div class="header-div2">
                                    <h5>Search Student By ID</h5>
                                </div>
                            </div>
                        </div>
                    </p-toolbar>
                </div>
            </div>

            <div class="surface-card border-round-2xl p-5 shadow-3">
                <form [formGroup]="studentProfileSearchGroup" class="w-full">

                    <!-- Search Input -->
                    <div class="flex justify-content-center mb-5">
                        <div class="w-full max-w-30rem">
                            <div class="p-inputgroup">
                                <input type="text" pInputText class="w-full" id="studentId" formControlName="studentId"
                                    placeholder="Enter Student ID..."
                                    [class]="{'p-invalid': studentProfileSearchGroup.get('studentId')?.invalid && studentProfileSearchGroup.get('studentId')?.touched}">
                                <button pButton type="button" icon="pi pi-search" class="p-button-primary"
                                    (click)="searchByStudentId(studentProfileSearchGroup.value.studentId)"
                                    [disabled]="!studentProfileSearchGroup.valid">
                                </button>
                            </div>
                            <small
                                *ngIf="studentProfileSearchGroup.get('studentId')?.invalid && studentProfileSearchGroup.get('studentId')?.touched"
                                class="p-error block mt-1">
                                Please enter a valid student ID
                            </small>
                        </div>
                    </div>

                    <!-- Recent Students Section -->
                    <div class="text-center">
                        <div class="mb-4">
                            <h3 class="text-900 font-semibold text-xl m-0 mb-2">Recent Searches</h3>
                            <div class="w-4rem h-1 bg-primary mx-auto border-round"></div>
                        </div>

                        <div *ngIf="studentIdAndImageList.length > 0; else emptyState" class="recent-searches-grid">
                            <div *ngFor="let student of studentIdAndImageList; let i = index">
                                <div class="student-card circular-card shadow-2"
                                    (click)="onStudentIdAndImageClick(student.studentId)">
                                    <div class="inner-wrapper">
                                        <img [src]="student.imageUrl" [alt]="'Student ' + student.studentId"
                                            class="student-avatar mb-2">
                                        <div class="student-id-text font-medium text-sm">
                                            {{ student.studentId }}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <ng-template #emptyState>
                            <div class="text-center py-6">
                                <i class="pi pi-users text-400 text-6xl mb-3"></i>
                                <p class="text-600 text-lg font-medium m-0">No recent students found</p>
                                <p class="text-500 text-sm mt-2 m-0">Start by searching for a student ID above</p>
                            </div>
                        </ng-template>
                    </div>
                </form>
            </div>
        </form>
    </div>
</div>
