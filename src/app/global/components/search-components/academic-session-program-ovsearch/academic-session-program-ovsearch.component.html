<form [formGroup]="filterSearchFormGroup" class="fluid formgrid grid align-items-end">
    <div class="field col-12 sm:col-6 md:col-4 lg:col-4">
        <label for="academicSessionId">AcademicSession</label>
        <p-select [filter]="true" inputId="academicSessionId" [options]="academicSessionSelectItemList"
            [style]="{'width':'100%'}" formControlName="academicSessionId" styleClass="text-base text-color surface-overlay border-1 border-solid 
                surface-border border-round appearance-none outline-none focus:border-primary w-full"
            (onChange)="onAcademicSessionIdChange($event)" placeholder="AcademicSession">
        </p-select>
    </div>

    <div class="field col-12 sm:col-6 md:col-4 lg:col-4">
        <label for="programId">Program</label>
        <p-select [filter]="true" inputId="programId" [options]="programSelectItemList"
            (onChange)="onProgramIdsChange($event)" styleClass="text-base text-color surface-overlay border-1 border-solid 
                surface-border border-round appearance-none outline-none focus:border-primary w-full"
            [style]="{'width':'100%'}" [showClear]="true" formControlName="programId" placeholder="Program">
        </p-select>
    </div>

    <div class="field col-12 sm:col-6 md:col-4 lg:col-4">
        <label for="operationalVerticalId">OperationalVertical</label>
        <p-select [filter]="true" inputId="operationalVerticalId" [options]="operationalVerticalSelectItemList"
            styleClass="text-base text-color surface-overlay border-1 border-solid 
                surface-border border-round appearance-none outline-none focus:border-primary w-full"
            [style]="{'width':'100%'}" [showClear]="true" formControlName="operationalVerticalId"
            placeholder="OperationalVertical">
        </p-select>
    </div>
</form>
