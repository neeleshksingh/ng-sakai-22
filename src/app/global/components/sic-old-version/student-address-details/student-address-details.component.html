<div class="col-12">
    <div class="card" *ngFor="let address of tableArrayAddressDetailsList">
        <p-table #dt2 [value]="address" [rowHover]="true" dataKey="id" autoLayout="true" resizableColumns="true"
            styleClass="p-datatable-customers p-datatable-gridlines p-datatable-striped p-datatable-lg">
            <ng-template pTemplate="caption">
                <h5>{{address[0].col2}} Address</h5>
            </ng-template>

            <ng-template pTemplate="body" let-studentAddress>
                <tr>
                    <td style="width: 25%; padding: 8px !important;">
                        {{studentAddress?.col1}}
                    </td>
                    <td style="width: 25%;">
                        <b>{{studentAddress?.col2}}</b>
                    </td>
                    <td style="width: 25%;">
                        {{studentAddress?.col3}}
                    </td>
                    <td style="width: 25%;">
                        <b>{{studentAddress?.col4}}</b>
                    </td>
                </tr>
            </ng-template>

        </p-table> <br>
    </div>
</div>
